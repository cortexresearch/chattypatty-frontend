<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://chat.pxpony.com/">
    <meta property="og:site_name" content="PxPony Chat">
    <meta property="og:title" content="PxPony Chat - World's Largest Chat Room">
    <meta property="og:description" content="Join the planet-sized chat room on pxpony.com and connect with people around the world!">
    <meta property="og:image" content="https://chat.pxpony.com/assets/OG.jpg">
    <meta property="og:image:width" content="500">
    <meta property="og:image:height" content="300">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://chat.pxpony.com/">
    <meta property="twitter:title" content="PxPony Chat - World's Largest Chat Room">
    <meta property="twitter:description" content="Join the planet-sized chat room on pxpony.com and connect with people around the world!">
    <meta property="twitter:image" content="https://chat.pxpony.com/assets/OG.jpg">

    <title>PxPony Chat - World's Largest Chat Room</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.87.0/dist/phaser.min.js"></script>
    <!-- Social Media Share APIs -->
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
    <script async src="https://platform.twitter.com/widgets.js"></script>
    <script src="https://platform.linkedin.com/in.js" type="text/javascript">lang: en_US</script>
</head>
<body style="background-color: #FF69B4;">
    <div id="loading-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #FF69B4; z-index: 20000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;">
        <img src="assets/logo.svg" alt="PxPony" style="width: 100px; margin-bottom: 20px;">
        
        <div style="width: 200px; height: 10px; background: #333; border-radius: 5px; overflow: hidden; border: 1px solid #555;">
            <div id="loading-bar" style="width: 0%; height: 100%; background: #38bdf8; transition: width 0.1s;"></div>
        </div>

        <div id="status-text" style="margin-top: 10px; font-family: Arial, sans-serif; font-size: 14px; color: #ffd1dc;">Loading Metaverse...</div>
    </div>

    <div id="game-container"></div>
    <div id="map-container" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5;"></div>
    
    <!-- HTML UI Overlay -->
    <div id="ui-overlay" style="position: fixed; top: 70px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 10000; align-items: flex-end; opacity: 0; transition: opacity 0.5s;">
        <button id="share-btn" class="ui-button" style="background-color: #a2f2a2;">Share</button>
        <button id="mic-btn" class="ui-button" style="background-color: #cccccc;">MIC OFF</button>
        <button id="map-btn" class="ui-button" style="background-color: #a2c2f2;">🌐</button>
    </div>

    <!-- Ad banner overlay -->
    <a id="ad-link" href="#" target="_blank" style="opacity: 0; transition: opacity 0.5s;">
        <div id="ad-banner" class="ad-banner">
            <img id="ad-image" src="" alt="Advertisement">
        </div>
    </a>

    <script>
        // Initialize Facebook SDK
        window.fbAsyncInit = function() {
            FB.init({
                appId: 'your-fb-app-id',
                autoLogAppEvents: true,
                xfbml: true,
                version: 'v12.0'
            });
        };

        // Initialize social share handlers
        function shareToFacebook(url) {
            FB.ui({
                method: 'share',
                href: url,
            });
        }

        function shareToTwitter(url, text) {
            window.open(`https://twitter.com/intent/tweet?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`, '_blank');
        }

        function shareToLinkedIn(url) {
            window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`, '_blank');
        }
    </script>
    <script src="js/main.js"></script>
</body>
</html>
