<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PxPony | Ad Analytics</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <style>
        :root {
            --bg: #FF69B4;
            --card-bg: #ffffff;
            --accent: #38bdf8;
            --text: #000000;
            --text-muted: #666666;
            --border: #000000;
        }
        body { 
            font-family: Arial, sans-serif; 
            padding: 40px 20px; 
            background: var(--bg); 
            color: var(--text);
            margin: 0;
            line-height: 1.5;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header { 
            margin-bottom: 40px; 
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .logo { width: 60px; }
        h1 { font-size: 2.5rem; margin: 0; color: #fff; text-shadow: 2px 2px 0 #000; letter-spacing: -1px; }
        .subtitle { color: #fff; font-size: 1.1rem; font-weight: bold; }
        
        .stat-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); 
            gap: 24px; 
            margin-bottom: 40px; 
        }
        .card { 
            background: var(--card-bg); 
            padding: 24px; 
            border-radius: 16px; 
            border: 3px solid var(--border);
            box-shadow: 8px 8px 0 #000;
        }
        
        .stat-item { display: flex; flex-direction: column; }
        .stat-value { font-size: 2.5rem; font-weight: 800; color: var(--text); line-height: 1; margin-bottom: 8px; }
        .stat-label { color: var(--text-muted); text-transform: uppercase; font-size: 0.8rem; font-weight: 600; letter-spacing: 1px; }
        
        .table-container { 
            background: var(--card-bg); 
            border-radius: 16px; 
            border: 3px solid var(--border);
            overflow: hidden;
            box-shadow: 8px 8px 0 #000;
        }
        .table-header { padding: 24px; border-bottom: 2px solid var(--border); }
        .table-header h2 { margin: 0; font-size: 1.25rem; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 16px 24px; background: #f0f0f0; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; border-bottom: 2px solid var(--border); }
        td { padding: 16px 24px; border-bottom: 1px solid #eee; color: var(--text); font-size: 0.95rem; }
        tr:last-child td { border-bottom: none; }
        
        a { color: #38bdf8; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        .count-cell { font-family: monospace; font-size: 1.1rem; color: #000; font-weight: 600; }
        
        .refresh-indicator { 
            display: inline-block; 
            width: 8px; 
            height: 8px; 
            background: #22c55e; 
            border-radius: 50%; 
            margin-right: 8px;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        @media (max-width: 640px) {
            h1 { font-size: 1.8rem; }
            body { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="assets/logo.svg" alt="PxPony" class="logo">
            <div>
                <h1>Ad Analytics</h1>
                <div class="subtitle">
                    <span class="refresh-indicator"></span>
                    Live Advertisement Monitoring
                </div>
            </div>
        </header>

        <div class="stat-grid">
            <div class="card stat-item">
                <div id="visitor-count" class="stat-value">...</div>
                <div class="stat-label">Unique Visitors</div>
            </div>
            <div class="card stat-item">
                <div id="impression-count" class="stat-value">...</div>
                <div class="stat-label">Total Impressions</div>
            </div>
            <div class="card stat-item">
                <div id="player-count" class="stat-value">...</div>
                <div class="stat-label">Live Players</div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h2>Ad Distribution Breakdown</h2>
            </div>
            <table id="ad-table">
                <thead>
                    <tr>
                        <th>Destination URL</th>
                        <th>Impressions</th>
                    </tr>
                </thead>
                <tbody id="ad-rows">
                    <tr><td colspan="2" style="text-align: center; padding: 40px; color: #666;">Loading data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://chattypatty-backend-production.up.railway.app';

        async function updateStats() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/stats`);
                const data = await response.json();

                document.getElementById('visitor-count').innerText = data.uniqueVisitorsCount.toLocaleString();
                document.getElementById('impression-count').innerText = data.totalAdPlays.toLocaleString();
                document.getElementById('player-count').innerText = data.activePlayersCount.toLocaleString();

                const rows = Object.entries(data.adPlays)
                    .sort((a, b) => b[1] - a[1])
                    .map(([url, count]) => `
                        <tr>
                            <td><a href="${url}" target="_blank">${url}</a></td>
                            <td class="count-cell">${count.toLocaleString()}</td>
                        </tr>`)
                    .join('');

                document.getElementById('ad-rows').innerHTML = rows || '<tr><td colspan="2" style="text-align: center; color: #666;">No impressions recorded yet</td></tr>';
            } catch (error) {
                console.error('Error updating stats:', error);
            }
        }

        updateStats();
        setInterval(updateStats, 10000);
    </script>
</body>
</html>
